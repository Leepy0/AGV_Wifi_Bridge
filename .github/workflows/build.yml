# ESP-IDF 빌드 → 플래시용 바이너리 묶음(zip) 업로드
#  - main 푸시 / 수동 실행: Actions 아티팩트
#  - v* 태그 푸시        : GitHub Release 에 첨부 (다운로드 URL 고정)
#  - 수동 실행 release=true: CMakeLists.txt 의 PROJECT_VER 로 vX.Y.Z 태그와 GitHub Release 를 만든다
#                          (태그 push 가 막힌 환경용. 같은 태그가 다른 커밋에 이미 있으면 실패)
#  - 모든 빌드 전에 host-test (gcc 호스트 시험 + dsp_pack.py selftest) 통과 필요
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'PROJECT_VER 로 vX.Y.Z 태그 + GitHub Release 발행'
        type: boolean
        default: false

permissions:
  contents: write

# 정식 발행은 한 번에 하나만, 취소하지 않음. PR 빌드는 새 푸시가 오면 이전 것을 취소
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) && 'release' || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 부트로더(섹터 A, OTA 로 못 바꿈)·브리지 공용 프로토콜, 앱 업데이트 진입 판정, 부트로더 진입 시뮬레이션,
      # 패커 selftest·기준 .dspfw 재현 (tests/host/run.sh)
      - name: Host tests (gcc + python3)
        run: |
          gcc --version | head -1
          python3 --version
          bash tests/host/run.sh
          # 브리지 메인보드 OTA 흐름(dsp_ota.c 시뮬레이션)·검사 도우미, 공통 유틸·자체 OTA 시작·명령 처리
          sh tests/dsp_ota_host/run.sh
          make -C tests/bridge_util

  build:
    needs: host-test
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Version string
        id: ver
        run: |
          BASE=$(grep -oP 'set\(PROJECT_VER "\K[^"]+' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [[ "$RELEASE" == "true" ]]; then
            VER="$BASE"
          else
            VER="${BASE}-${GITHUB_SHA::7}"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "version: $VER"

      # 수동 정식 발행: 버전 형식 확인, 같은 태그가 다른 커밋을 가리키면 중단 (같은 커밋이면 재실행으로 보고 계속)
      - name: Release tag check
        if: env.RELEASE == 'true'
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          TAG="v$VER"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::PROJECT_VER '$VER' 가 X.Y.Z 형식이 아님"; exit 1
          fi
          # 주석 태그는 ^{} 로 가리키는 커밋을 얻는다
          REMOTE=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | sort -k2 | tail -1 | cut -f1)
          if [[ -n "$REMOTE" && "$REMOTE" != "$GITHUB_SHA" ]]; then
            echo "::error::태그 $TAG 가 이미 다른 커밋($REMOTE)에 있음 — CMakeLists.txt 의 PROJECT_VER 를 올리세요"; exit 1
          fi
          echo "tag $TAG → $GITHUB_SHA ${REMOTE:+(이미 있음, 같은 커밋)}"

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          command: idf.py -DPROJECT_VER=${{ steps.ver.outputs.ver }} build merge-bin

      - name: Package
        run: |
          OUT=dist/agv_wifi_bridge_${{ steps.ver.outputs.ver }}
          mkdir -p "$OUT"
          sudo cp build/bootloader/bootloader.bin \
                  build/partition_table/partition-table.bin \
                  build/ota_data_initial.bin \
                  build/agv_wifi_bridge.bin "$OUT/"
          # flash_args 의 경로(bootloader/…, partition_table/…)를 zip 의 평평한 구조에 맞춤 → write_flash @flash_args 가능
          sudo sed 's#[^ ]*/##' build/flash_args > "$OUT/flash_args"
          sudo cp build/merged-binary.bin "$OUT/agv_wifi_bridge_merged.bin"
          cp tools/flash.bat tools/flash.sh docs/FLASH_GUIDE.md "$OUT/"
          cp -r docs/images "$OUT/images"   # FLASH_GUIDE.md 의 그림 (images/*.png)
          sudo chown -R "$USER" dist
          cat > "$OUT/README.txt" <<TXT
          AGV Wi-Fi Bridge ${{ steps.ver.outputs.ver }} (ESP32-S3, ESP-IDF v6.1)

          [USB 로 처음 굽기 — 전체 이미지]
            flash.bat COM5              (Windows, esptool 자동 탐색)
            ./flash.sh /dev/ttyUSB0     (Linux/macOS)
            = esptool --chip esp32s3 -p COM5 -b 921600 write_flash 0x0 agv_wifi_bridge_merged.bin
            ※ 전체 이미지는 저장된 호기 설정을 지움. 설정 유지하고 다시 굽기:
              esptool --chip esp32s3 -p COM5 write_flash 0xf000 ota_data_initial.bin 0x20000 agv_wifi_bridge.bin

          [호기 설정]
            처음 부팅 시 무선 설정 모드(BLE) 자동 열림 → 휴대폰 BLE 터미널 앱으로 AGVBR-xx-xxxx 연결, login agvsetup
            또는 USB 콘솔(115200) set/save/reboot, 서버 원격 cfg 명령. 자세한 절차: FLASH_GUIDE.md

          [OTA — 서버에서 무선 업데이트]
            agv_wifi_bridge.bin 만 HTTP 로 서비스하고 OTA_START 패킷으로 URL 전달
            (BridgeTest: ota <agv> agv_wifi_bridge.bin)

          [개별 오프셋]  flash_args 참조 (bootloader 0x0, partition-table 0x8000, ota_data 0xf000, app 0x20000)
          ※ 0.5.0 부터 파티션이 바뀜(OTA 슬롯 1.75MB + dspfw). 이전 버전에서 올 때는 USB 전체 굽기 필요
          TXT
          cd dist && zip -r "agv_wifi_bridge_${{ steps.ver.outputs.ver }}.zip" "agv_wifi_bridge_${{ steps.ver.outputs.ver }}"
          ls -l
          # 앱 크기 / OTA 슬롯(0x1C0000) 사용률을 실행 요약에 표시
          APP=$(stat -c %s "agv_wifi_bridge_${{ steps.ver.outputs.ver }}/agv_wifi_bridge.bin")
          SLOT=$((0x1C0000))
          {
            echo "### agv_wifi_bridge ${{ steps.ver.outputs.ver }}"
            echo "- app: $APP bytes ($((APP * 100 / SLOT))% of OTA slot $SLOT)"
            echo '```'; ls -l "agv_wifi_bridge_${{ steps.ver.outputs.ver }}"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 앱(AGV CFG Manager)이 api.github.com 없이 최신 버전·체크섬을 알 수 있게 하는 매니페스트.
      # 주소: https://github.com/<repo>/releases/latest/download/bridge.json
      - name: Manifest (bridge.json)
        env:
          VER: ${{ steps.ver.outputs.ver }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, datetime
          ver, repo = os.environ["VER"], os.environ["REPO"]
          d = f"dist/agv_wifi_bridge_{ver}"
          def ent(path, offset=None):
              b = open(path, "rb").read()
              e = {"file": os.path.basename(path), "sha256": hashlib.sha256(b).hexdigest(), "size": len(b)}
              if offset: e["offset"] = offset
              return e
          m = {
              "version": ver,
              "published": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "page": f"https://github.com/{repo}/releases/tag/v{ver}",
              "zip": ent(f"dist/agv_wifi_bridge_{ver}.zip"),
              "app": ent(f"{d}/agv_wifi_bridge.bin", "0x20000"),
              "merged": ent(f"{d}/agv_wifi_bridge_merged.bin", "0x0"),
              "minPartitionVersion": "0.5.0",
              "notes": subprocess.check_output(["git", "log", "-1", "--format=%s"], text=True).strip(),
          }
          json.dump(m, open("dist/bridge.json", "w"), ensure_ascii=False, indent=2)
          PY
          cat dist/bridge.json

      - uses: actions/upload-artifact@v4
        with:
          name: agv_wifi_bridge_${{ steps.ver.outputs.ver }}
          path: dist/agv_wifi_bridge_${{ steps.ver.outputs.ver }}/

      # v* 태그 푸시, 또는 수동 실행 release=true (태그가 없으면 이 커밋에 만든다)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/agv_wifi_bridge_${{ steps.ver.outputs.ver }}.zip
            dist/agv_wifi_bridge_${{ steps.ver.outputs.ver }}/agv_wifi_bridge.bin
            dist/agv_wifi_bridge_${{ steps.ver.outputs.ver }}/agv_wifi_bridge_merged.bin
            dist/bridge.json
          generate_release_notes: true
